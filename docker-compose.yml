services:
  api:
    build: .
    container_name: torqtrace-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.4
    container_name: torqtrace-db
    profiles:
      - local-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: torqtrace
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - torqtrace-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  torqtrace-db-data:
